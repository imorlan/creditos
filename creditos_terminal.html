<!DOCTYPE html>


<html lang="es">
<head>
<meta charset="utf-8">   <!-- Codificación UTF-8: necesaria para ñ, acentos, ·, ●, ✔, etc. -->
<title>Créditos · Terminal fósforo verde</title>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>
  html, body { margin: 0; height: 100%; background: #111; color: #9fdfae;
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #lienzo canvas { display: block; box-shadow: 0 0 30px rgba(51,255,102,.15); }
  #barra { display: flex; gap: 12px; align-items: center; font-size: 14px; }
  button { background: #0b2a14; color: #33ff66; border: 1px solid #33ff66; padding: 8px 16px;
    font: inherit; border-radius: 4px; cursor: pointer; }
  button:hover { background: #12401f; }                 /* se ilumina al pasar el ratón */
  button:disabled { opacity: .45; cursor: default; }    /* aspecto "apagado" mientras graba */
  #estado { min-width: 300px; }
</style>


<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

</head>


<body>


  <div id="lienzo"></div>


  <div id="barra">
    <button id="btnRec">● Grabar vídeo (R)</button>
    <button id="btnReset">↺ Reiniciar (Espacio)</button>


    <span id="estado">Listo. Pulsa «Grabar vídeo».</span>
  </div>


<script>
// ============================================================
//  Títulos de crédito · Terminal CRT clásico · Efecto muelle
// ------------------------------------------------------------
//  Autor:       Iñaki Morlán
//  Contacto:    i.morlan@ehu.eus
//  Licencia:    MIT License (Libre uso, modificación y distribución)
//  
//  Especificaciones Técnicas:
//  · Lienzo/canvas: 714 x 440 px [*] |  Fotogramas: 25 fps
//  · Exportación: MP4 (H.264) / WebM vía MediaRecorder API [**]
// ============================================================
//
//  IDEA GENERAL DEL PROGRAMA
//  --------------------
//  1. Primero troceamos el texto: lo dividimos por líneas y luego letra por letra (un string/array).
//  2. Renderizamos cada letra una a una en su coordenada del canvas.
//  3. Todo el grupo de líneas va haciendo un scroll vertical suave hacia arriba.
//  4. Añadimos un efecto muelle: la primera letra (a la izquierda) se queda casi congelada en el margen, 
//     pero según avanza hacia la derecha, las letras sufren un delay y una oscilación mucho mayor, 
//     haciendo que la línea se mueva de más a menos y parezca un chicle al estirarse.
//  5. Look CRT clásico: verde fósforo, efecto glow, scanlines (o líneas de barrido) y un toque de 
//     parpadeo retro.
//  6. Se graba/captura el canvas en tiempo real con MediaRecorder y se descarga el vídeo automáticamente 
//     (MP4/WebM) al finalizar.
//
//  [*]  Proporción condicionada por el formato original en película Super 8. 
//       Para cambiar las dimensiones, basta con modificar las constantes W y H.
//  [**] Con Chrome/Edge 126 o superior, la web creará un archivo .mp4 real directamente al descargar.
//       Con una versión anterior (u otro navegador sin ese soporte: Firefox, Safari), la exportación a MP4 
//       fallará o la página te obligará a descargar el vídeo en formato .webm.
//
//  Nota.- El texto de los créditos desplegado (scroll) en pantalla se puede editar directamente 
//         en la constante `TEXTO`.
// ============================================================


// ------------------------------------------------------------
//  CONSTANTES BÁSICAS DEL VÍDEO
// ------------------------------------------------------------
const W = 714, H = 440; // W y H: tamaño del lienzo (y del vídeo) en píxeles.
const FPS = 25; // FPS: fotogramas por segundo



// Texto de los créditos. 
   // Con comillas invertidas (``) se pueden escribir varias líneas.
   // Los espacios dobles y las líneas vacías se conservan: las líneas vacías son las
   //     pausas ("aire") del scroll.
const TEXTO = 
`"Volare (Nel blu dipinto di blu)"
(D. Modugno, F. Migliacci)
Interpretada por Domenico Modugno


"One"
(J. Hetfield, L. Ulrich)
Interpretada por Metallica


"Help!"
(J. Lennon, P. McCartney)
Interpretada por Dolly Parton






FATAL  ERROR:  OUT  OF  MEMORY


Iñaki  Morlán  Santa  Catalina
Arte  y  Tecnología  III · G01
20-X-2026


H264 - 25  fps - 714x440`;

// ------------------------------------------------------------
//  AJUSTES
// ------------------------------------------------------------
const TAM = 16;            // tamaño de la letra en px
const INTERLINEA = 28;     // distancia vertical entre líneas (px). Menos = más compacto
const MARGEN_IZQ = 48;     // margen izquierdo: el texto queda justificado a la izquierda
const VELOCIDAD = 0.95;    // px que sube el texto por fotograma (0.95 × 25 ≈ 24 px/s)
const ESTIRO = 0.9;        // estiramiento máximo: 0.9 = la línea llega a +90 % de ancho
const RETARDO = 0.05;      // desfase (s) entre una letra y la siguiente → crea la "onda"
const VELOCIDAD_MUELLE = 0.8;       // ritmo del muelle: 1 = normal, menor = más pausado
const COLOR_VERDE = [51, 255, 102]; // RGB del verde fósforo (#33FF66)


// ------------------------------------------------------------
//  VARIABLES DE ESTADO 
// ------------------------------------------------------------
let lineas = [], pos_x = [], fase = [];
   // lineas: lista con cada línea de texto
   // pos_x: pos_x[i][j] = posición x ORIGINAL (sin estirar) de la letra j de la línea i
   // fase: fase[i] = desfase propio de la línea i, para que no se muevan todas a la vez

let f = 0, fin_frames = 0, scan;
   // f: contador de fotogramas propio (no frameCount): 
   //    permite reiniciar y reproducir igual
   // fin_frames: nº de fotogramas que dura una pasada completa
   // scan: capa gráfica con las líneas de barrido (scanlines), creada una sola vez

let grabando = false, recorder = null, trozos = [], mime_elegido  = "";
   // grabando: indica si la grabación está activa en este momento
   // recorder: objeto MediaRecorder del navegador
   // trozos: bloques de vídeo que va generando el navegador
   // mime_elegido : formato elegido (mp4 si el navegador puede, si no webm)


// Elementos de la interfaz para cambiar su texto o estado desde el código.
// El '$' delante del nombre es solo una convención para indicar que es un elemento HTML.
const $estado = document.getElementById("estado");
const $btnRec = document.getElementById("btnRec");




// ============================================================
//  setup(): p5 lo ejecuta sólo una vez al arrancar
// ============================================================
function setup() {
  pixelDensity(1);              // Fuerza escala 1:1 para evitar descuadres de tamaño en pantallas de 
                                // alta densidad.
  const c = createCanvas(W, H);
  c.parent("lienzo");           // Inserta el canvas dentro de <div id="lienzo"> en lugar del final 
                                // de la página
  frameRate(FPS);               // p5.js llamar a draw() 25 veces por segundo. 
                                // Configura la animación a 25 FPS
  randomSeed(7);                // Fija la semilla random para que el resultado sea siempre idéntico,
                                // es decir, que el resultado sea repetible


  // Tipografía: "monospace" usa la fuente monoespaciada por defecto del sistema
    textFont("monospace");        // textFont("'Courier New', Courier, monospace");
  textSize(TAM);
  textAlign(LEFT, BASELINE);    // El punto (x, y) de cada letra es su esquina inferior izquierda
  noStroke();                   // Dibuja el texto solo con relleno (fill), sin borde (sin stroke)


  // 1) Divide el texto en un array de líneas
  lineas = TEXTO.split("\n");

  // 2) Para cada línea, calcula a posición X de cada letra y desfasa la fase del muelle
  for (let i = 0; i < lineas.length; i++) {
    let acum = 0, pos = [];                 // acum: ancho acumulado hasta la letra actual
    for (const ch of lineas[i]) {           // Recorre la línea letra a letra
      pos.push(acum);                       // Guarda el origen X para la letra actual
      acum += textWidth(ch);                // Suma el ancho de la letra para la siguiente iteración
    }
    pos_x.push(pos);


    // Desfase progresivo por línea (i * 0.7) con variación aleatoria (±0.3) para romper la simetría
    fase[i] = i * 0.7 + random(-0.3, 0.3);
  }


  // 3) Crea la textura de scanlines (filtro CRT) en un buffer secundario para optimizar el
  //    rendimiento: rayas horizontales oscuras semitransparentes que imitan un monitor CRT.
  //    Se dibujan una vez en una capa aparte (createGraphics) y luego solo se pegan en cada
  //    fotograma: es más rápido que redibujarlas siempre.
  scan = createGraphics(W, H);
  scan.pixelDensity(1);
  scan.noStroke();
  scan.fill(0, 55);                                       // negro semitransparente ~21.5% (55 de 255)
  for (let y = 0; y < H; y += 3) scan.rect(0, y, W, 1);   // Dibuja una línea horizontal de 1 px cada 3 px

  // 4) Calcula la duración de la animación en fotogramas hasta que el texto sale totalmente de pantalla,
  //    es decir, calcula el fotograma final en función de la última línea y la velocidad de scroll
  //    La primera línea empieza en Y = H + 30; la última en H + 30 + (n-1) * INTERLINEA.
  //    Añadimos 40 px de margen de salida y dividimos por la velocidad para obtener los fotogramas totales.
  const y_ultima0 = H + 30 + (lineas.length - 1) * INTERLINEA; // Posición Y inicial de la última línea
  fin_frames = Math.ceil((y_ultima0 + 40) / VELOCIDAD);        // Calcula la distancia a recorrer en frames

  // 5) Asigna las acciones a los botones de la interfaz de usuario HTML
  $btnRec.onclick = iniciar_grabacion;                                  // Inicia/detiene la grabación
  document.getElementById("btnReset").onclick = reiniciar_animacion;
  // RReinicia la animación si no se está grabando
}

// ============================================================
// Reinicia la animación desde el principio, pero sólo si no se está grabando, 
// para no estropear el vídeo
// ============================================================
function reiniciar_animacion() {
  if (!grabando) f = 0;
}


// ============================================================
//  muelle(t): Calcula el movimiento elástico
//  Recibe el tiempo 't' y devuelve el estiramiento en píxeles (de 0 a ESTIRO).
// ============================================================
// 1. Mezcla de ondas (Efecto orgánico): Se superponen tres funciones senoidales 
//    aperiódicas. Se suman tres ondas seno a distintas frecuencias (2.1, 3.7 y 6.3). 
//    Al no ser múltiples entre sí, la oscilación casi no se repite y parece más 
//   natural, más orgánico y no repetitivo.
//
// 2. Control de valores (Escala de -1 a 1): Los pesos (0.60 + 0.28 + 0.12 = 1.0) 
//    aseguran que el resultado 'a' nunca supere los límites entre -1 y 1. Dicho de
//    otro modo, se normalización de amplitudes a la unidad.
//
// 3. Ajuste al rango final (Solo hacia la derecha): La fórmula (0.5 + 0.5 * a) convierte 
//    el rango [-1, 1] en [0, 1]. Al multiplicarlo por ESTIRO, el valor final siempre es 
//    positivo (de 0 a ESTIRO). El valor devuelto es siempre mayor o igual a cero 
//    (no negativo). Esto asegura que los caracteres solo se desplacen hacia la derecha 
//    o retornen a su origen horizontal, impidiendo que sobrepasen el margen izquierdo.
function muelle(t) {
  const a = 0.60 * sin(t * 2.1) + 0.28 * sin(t * 3.7 + 1.3) + 0.12 * sin(t * 6.3 + 0.4);
  return ESTIRO * (0.5 + 0.5 * a);
}



// ============================================================
//  draw(): Bucle principal de renderizado de p5.js.
//  Se le llama periódicamente a la frecuencia fijada por frameRate(25)
//  para calcular y dibujar un nuevo fotograma en cada iteración.
// ============================================================
function draw() {
  background(0);                // 1) Limpia el canvas en cada fotograma, lo pone a negro (fondo del terminal)

  const ctx = drawingContext;   // Accede al CanvasRenderingContext2D nativo de la Web API,
                                // necesario para aplicar propiedades de sombra/resplandor (shadowBlur)

  // Calcula la variable temporal 't' en segundos a partir del fotograma actual (f / FPS)
  // e introduce el factor de escala VELOCIDAD_MUELLE para ralentizar o acelerar la oscilación
  const t = (f / FPS) * VELOCIDAD_MUELLE;

  // Posición Y de la primera línea: inicia fuera de pantalla por abajo (H + 30)
  // y decrementa su valor según VELOCIDAD para generar el scroll ascendente
  const scroll_y = H + 30 - f * VELOCIDAD;

  // Simula el parpadeo de la pantalla (0.88 a 1.0) combinando dos ondas seno basadas en el contador de 
  // fotogramas propio 'f' (sin usar azar) para que el resultado sea siempre idéntico
  const parpadeo = 0.94 + 0.06 * sin(f * 0.9) * sin(f * 0.23);

  // Configura el efecto de resplandor o brillo ("glow") aplicando una sombra difusa de color 
  // verde alrededor de las letras
  ctx.shadowColor = "rgba(51,255,102,0.85)";
  ctx.shadowBlur = 8;

  // Se recorre cada línea de texto para renderizarla
  for (let i = 0; i < lineas.length; i++) {
    const y = scroll_y + i * INTERLINEA;               // Calcula la coordenada vertical Y de la línea actual

    // Si la línea está totalmente fuera de la pantalla (arriba o abajo), la ignora para mejorar el rendimiento
    if (y < -TAM || y > H + TAM) continue;

    const linea = lineas[i];
    if (linea.trim() === "") continue;                // Salta las líneas en blanco sin dibujar nada 
                                                      // pero conservando su espacio (el "aire")

    // Transición suave (fade in/out): calcula el degradado del texto al entrar por abajo o salir por arriba.
    //  y / 70        → 0 en el borde superior, 1 a partir de 70 px
    //  (H - y) / 50  → 0 en el borde inferior, 1 a partir de 50 px
    // min() se queda con el más restrictivo; constrain() lo limita a 0..1.
    const borde = min(constrain(y / 70, 0, 1), constrain((H - y) / 50, 0, 1));

    // Color verde combinando la transparencia del borde con el parpadeo
    fill(COLOR_VERDE[0], COLOR_VERDE[1], COLOR_VERDE[2], 255 * borde * parpadeo);



    // Dibuja la línea letra a letra (j = índice de la letra)
    let j = 0;
    for (const ch of linea) {
      if (ch !== " ") {                               // Ignora espacios visibles (ya tienen su 
                                                      // hueco reservado en pos_x)
        
        const k = muelle(t - j * RETARDO + fase[i]);  // Estiramiento de la letra. Combina el tiempo, 
                                                      // un retardo por letra y el desfase de la línea

        // Estira la posición X según el factor de deformación 'k': cuanto más a la derecha está la letra, 
        // más se desplaza (efecto muelle anclado a la izquierda)
        text(ch, MARGEN_IZQ + pos_x[i][j] * (1 + k), y);
      }
      j++;
    }
  }

  ctx.shadowBlur = 0;           // Apaga el brillo para no distorsionar las scanlines (o líneas de barrido)
  image(scan, 0, 0);            // Superpone la capa de scanlines sobre el texto


  // Mientras se graba muestra el progreso de el tiempo transcurrido / total.
  if (grabando) {
    $estado.textContent = "● Grabando… " + Math.round(f / FPS) + " / " + Math.round(fin_frames / FPS) + " s";
  }


  // Control del ciclo de animación y fin de grabación
  if (f >= fin_frames) {
    if (grabando) detener_grabacion();   // Finaliza la captura al completar una pasada
    f = 0;                               // Reinicia el scroll para continuar en bucle
  } else {
    f++;                                 // siguiente fotograma
  }
}



// ============================================================
//  GRABACIÓN Y EXPORTACIÓN DE VÍDEO (WebAPI MediaRecorder)
// ============================================================
// Este bloque convierte las imágenes creados en la pantalla (canvas)
// en un archivo de vídeo que el usuario puede guardar en su ordenador.
// Funciona en tres pasos:
//  1. Elige el formato que mejor entienda el navegador (MP4 o WebM).
//  2. Captura el canvas 25 veces por segundo y guarda los datos.
//  3. Une todas las partes y fuerza una descarga automática.
// ============================================================

/**
 * Selecciona el formato de vídeo (MIME type) con mejor compatibilidad soportado por el navegador.
 * ¿Por qué es necesario? 
 * No todos los navegadores (Chrome, Firefox, Safari) saben grabar el mismo tipo de vídeo.
 * Por eso probamos una lista ordenada de mejor a peor: primero intentamos MP4 (el estándar más
 * compatible en móviles y reproductores) y, si el navegador no sabe crearlo, usamos WebM.
 * 
 * Devuelve el formato de vídeo soportado (string) o "" (cadena vacía) si no hay ninguno.
 */
function elegir_mime() {
  const candidatos = [
    "video/mp4;codecs=avc1.640028",   // MP4 con códec H.264 (Calidad alta: funciona en casi cualquier sitio)
    "video/mp4;codecs=avc1.42E01E",   // MP4 con códec H.264 (Compatibilidad amplia para dispositivos antiguos)
    "video/mp4;codecs=avc1",          // MP4 genérico
    "video/mp4",                      // Formato MP4 básico
    "video/webm;codecs=vp9",          // WebM con códec VP9 (Compresión moderna, ideal para web)
    "video/webm;codecs=vp8",          // WebM con códec VP8 (Formato WebM estándar)
    "video/webm"                      // Formato WebM básico
  ];

  // MediaRecorder.isTypeSupported() le pregunta al navegador: "¿Sabes grabar en este formato?"
  // .find() recorre la lista y se queda con la primera opción que el navegador responda que SÍ.
  return candidatos.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

/**
 * Prepara e inicia el proceso de captura de vídeo desde el canvas de p5.js.
 *  * ¿Cómo funciona la captura?
 * - captureStream(FPS): Toma fotogramas en vivo del canvas al ritmo fijado por FPS (25 imágenes/segundo).
 * - MediaRecorder: Es la cámara virtual que empaqueta esas imágenes en un archivo de vídeo.
 */
function iniciar_grabacion() {
  if (grabando) return;      // Si ya hay una grabación en marcha, interrumpe la función para evitar 
                             // grabar dos veces al mismo tiempo

  // Conecta la cámara virtual específicamente con el canvas del proyecto ("#lienzo canvas")
  const stream = document.querySelector("#lienzo canvas").captureStream(FPS);

  mime_elegido = elegir_mime();

  // Configura la grabadora con el formato elegido y una tasa de bits (bitrate) de 8 Mbps (8.000.000 bps).
  // La tasa de bits determina la calidad: 8 Mbps garantiza que el vídeo no pierda nitidez ni se vea pixelado.
  recorder = new MediaRecorder(stream, mime_elegido 
    ? { mimeType: mime_elegido, videoBitsPerSecond: 8000000 }
    : { videoBitsPerSecond: 8000000 });

  trozos = []; // Vector (array) temporal donde se van guardando los fragmentos de vídeo a medida que se procesan

  // Evento que se ejecuta periódicamente mientras se graba:
  // Conforme la grabadora genera pequeños paquetes de vídeo ("chunks"), los guardamos en el vector 'trozos'.
  recorder.ondataavailable = e => { 
    if (e.data.size > 0) trozos.push(e.data); 
  };

  // Evento que se ejecuta cuando la grabación se detiene (al llamar a recorder.stop()):
  // Junta todos los pedazos de vídeo, crea un archivo final en memoria e inicia la descarga en la carpeta del usuario.
  recorder.onstop = () => {
    const ext = mime_elegido.includes("mp4") ? "mp4" : "webm";
    
    // Un Blob (Binary Large Object) es una estructura que junta todos los trozos en un único "bloque" de datos
    const blob = new Blob(trozos, { type: mime_elegido || "video/webm" });

    // Truco de descarga automática: simulación del clic de descarga
    // Crea un enlace invisible apuntando al vídeo generado en memoria (ObjectURL)
    // y simula un clic (.click()) para que la descarga comience sin intervención del usuario.
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "creditos_terminal." + ext; // Nombre predeterminado del archivo que recibirá el usuario
    a.click();

    // Reestablece los botones y avisa al usuario en pantalla de lo que ha sucedido
    $btnRec.disabled = false;
    $estado.textContent = ext === "mp4"
      ? "✔ Descargado creditos_terminal.mp4"
      : "Se descargó .webm (tu navegador no graba MP4). Conviértelo con HandBrake o ffmpeg.";
  };

  f = 0;                  // Resetea el contador de fotogramas a 0 para que la animación empiece desde el inicio exacto
  recorder.start();       // Pone a funcionar la grabadora
  grabando = true;
  $btnRec.disabled = true; // Desactiva el botón de grabar durante la captura para evitar interferencias
}

/**
 * Detiene la grabación actual y activa la descarga del vídeo final.
 */
function detener_grabacion() {
  if (recorder && grabando) {
    grabando = false;
    recorder.stop();      // Ordena a la grabadora parar, lo que desencadena la función 'recorder.onstop' definida arriba
    $estado.textContent = "■ Terminado. Descargando…";
  }
}


// ============================================================
//  TECLADO
// ============================================================
//  · Tecla 'R' / 'r': Inicia la grabación del vídeo.
//  · Barra espaciadora (' '): Reinicia la animación desde el principio (si no se está grabando).
// Al devolver false se evita que el espacio haga scroll en la página.
// Como los botones están fuera del lienzo, aquí no hace falta hacer clic antes en él.
function keyPressed() {
  if (key === "r" || key === "R") iniciar_grabacion();
  if (key === " " && !grabando) { f = 0; return false; }
}


</script>
</body>
</html>
